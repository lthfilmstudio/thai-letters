<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Thai Alphabet</title>
<link rel="manifest" href="./manifest.json" />
<link rel="icon" type="image/png" sizes="32x32" href="./assets/icons/favicon-32.png" />
<link rel="apple-touch-icon" href="./assets/icons/apple-touch-icon.png" />
<meta name="theme-color" content="#0F1814" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Noto+Sans+Thai:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500&family=Sarabun:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="./css/tokens.css" />
<link rel="stylesheet" href="./css/base.css" />
<link rel="stylesheet" href="./css/browse.css" />
<link rel="stylesheet" href="./css/modal.css" />
<link rel="stylesheet" href="./css/combo.css" />
<link rel="stylesheet" href="./css/words.css" />
</head>
<body>
<div class="app">

  <header>
    <div class="title-block">
      <div class="eyebrow">Thai Alphabet · Interactive Reference</div>
      <h1><span class="thai">อักษรไทย</span></h1>
    </div>
    <div class="stats">
      <div class="stat">
        <div class="stat-num" id="stat-total">—</div>
        <div class="stat-label">total</div>
      </div>
      <div class="stat">
        <div class="stat-num" id="stat-current">—</div>
        <div class="stat-label">showing</div>
      </div>
    </div>
  </header>

  <!-- Mode Switcher -->
  <div class="modes" role="tablist">
    <button class="mode-btn active" data-mode="browse">瀏覽</button>
    <button class="mode-btn" data-mode="combo">拼字盤</button>
    <button class="mode-btn" data-mode="words">單字</button>
  </div>

  <!-- ============ BROWSE VIEW ============ -->
  <div class="view active" id="view-browse">
    <div class="cat-tabs" id="cat-tabs"></div>
    <div class="tone-filter" id="tone-filter">
      <button class="tone-pill active" data-tone="all">全部</button>
      <button class="tone-pill" data-tone="mid">中音 Mid</button>
      <button class="tone-pill" data-tone="high">高音 High</button>
      <button class="tone-pill" data-tone="low">低音 Low</button>
    </div>
    <div class="grid" id="grid"></div>
  </div>

  <!-- ============ COMBO VIEW ============ -->
  <div class="view" id="view-combo">
    <div class="combo-consonants" id="combo-consonants"></div>
    <div class="combo-grid" id="combo-grid"></div>
    <div class="combo-word" id="combo-word"></div>
  </div>

  <!-- ============ WORDS VIEW ============ -->
  <div class="view" id="view-words">
    <div class="combo-consonants" id="words-consonants"></div>
    <div class="words-hide">
      <span class="words-hide-label">遮住</span>
      <button class="words-hide-btn active" data-hide="none">不遮</button>
      <button class="words-hide-btn" data-hide="zh">中文</button>
      <button class="words-hide-btn" data-hide="th">泰文</button>
    </div>
    <div class="words-list" id="words-list"></div>
  </div>

</div>

<!-- Detail Modal -->
<div class="modal-backdrop" id="modal-backdrop">
  <div class="modal" id="modal">
    <div class="modal-hero">
      <button class="modal-close" id="modal-close" aria-label="Close">✕</button>
      <div class="modal-char" id="m-char">—</div>
      <span class="modal-tone-tag" id="m-tone" data-tone="mid">—</span>
    </div>
    <div class="modal-body">
      <div class="info-row">
        <div class="info-label">字母名稱</div>
        <div class="info-value info-value--row">
          <span id="m-name" class="name-thai">—</span>
          <button class="inline-play-btn" id="m-play-name" aria-label="播放名稱">
            <svg viewBox="0 0 16 16" fill="currentColor"><path d="M3 2l11 6-11 6V2z"/></svg>
          </button>
        </div>
      </div>
      <div class="info-row">
        <div class="info-label">羅馬拼音</div>
        <div class="info-value"><span class="roma" id="m-roma">—</span></div>
      </div>
      <div class="info-row" id="m-rep-row">
        <div class="info-label">代表詞</div>
        <div class="info-value">
          <div class="rep-block">
            <div class="rep-text-wrap">
              <span class="rep-thai" id="m-rep-thai">—</span>
              <span class="rep-zh" id="m-rep-zh">—</span>
            </div>
            <div class="rep-play">
              <span class="rep-icon" id="m-rep-icon">—</span>
              <button class="inline-play-btn" id="m-play-rep" aria-label="播放代表詞">
                <svg viewBox="0 0 16 16" fill="currentColor"><path d="M3 2l11 6-11 6V2z"/></svg>
              </button>
            </div>
          </div>
        </div>
      </div>
      <div class="info-row">
        <div class="info-label info-label--serif">字形</div>
        <div class="info-value">
          <div class="font-compare">
            <div class="font-sample">
              <span class="font-char font-char--noto" id="m-font-noto">—</span>
              <span class="font-label">Noto Sans Thai</span>
            </div>
          </div>
        </div>
      </div>
      <div class="info-row" id="m-class-row">
        <div class="info-label">聲調類別</div>
        <div class="info-value" id="m-class">—</div>
      </div>
      <button class="play-btn" id="m-play">
        <svg class="play-icon" viewBox="0 0 16 16" fill="currentColor"><path d="M3 2l11 6-11 6V2z"/></svg>
        <span>播放發音</span>
      </button>
    </div>
  </div>
</div>

<script type="module" src="./js/main.js"></script>
</body>
</html>
