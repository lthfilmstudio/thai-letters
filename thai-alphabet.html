<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>泰文字母互動學習</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Noto+Sans+Thai:wght@400;500;600;700&family=Sarabun:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg: #0F1814;
    --panel: #1A2B24;
    --card: #243830;
    --card-flipped: #2D4A3E;
    --gold: #C4A574;
    --gold-soft: #C4A57433;
    --gold-dim: #8a7553;
    --text: #F5F0E8;
    --text-dim: #F5F0E899;
    --text-mute: #F5F0E866;
    --danger: #E8948F;
    --tone-mid: #C4A574;
    --tone-high: #E8B86F;
    --tone-low: #7FA68A;
    --border: #F5F0E81A;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    background: var(--bg);
    color: var(--text);
    font-family: "Sarabun", "Noto Sans Thai", -apple-system, sans-serif;
    min-height: 100vh;
    overflow-x: hidden;
  }

  body {
    background:
      radial-gradient(ellipse at top left, #1A2B2440 0%, transparent 50%),
      radial-gradient(ellipse at bottom right, #2D4A3E30 0%, transparent 50%),
      var(--bg);
    background-attachment: fixed;
  }

  /* Subtle grain texture */
  body::before {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    opacity: 0.04;
    z-index: 100;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
  }

  .app {
    max-width: 1280px;
    margin: 0 auto;
    padding: 48px 32px 80px;
    position: relative;
  }

  /* ─── Header ─── */
  header {
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    margin-bottom: 56px;
    padding-bottom: 24px;
    border-bottom: 1px solid var(--border);
  }

  .title-block .eyebrow {
    font-family: "JetBrains Mono", monospace;
    font-size: 11px;
    letter-spacing: 0.24em;
    text-transform: uppercase;
    color: var(--gold);
    margin-bottom: 12px;
  }

  .title-block h1 {
    font-family: "Cormorant Garamond", serif;
    font-weight: 500;
    font-size: clamp(40px, 5vw, 64px);
    line-height: 1;
    letter-spacing: -0.02em;
  }

  .title-block h1 .thai {
    font-family: "Noto Sans Thai", serif;
    font-weight: 600;
    color: var(--gold);
    margin-right: 16px;
  }

  .title-block .subtitle {
    font-family: "Cormorant Garamond", serif;
    font-style: italic;
    font-size: 18px;
    color: var(--text-dim);
    margin-top: 12px;
  }

  .stats {
    display: flex;
    gap: 32px;
    text-align: right;
  }

  .stat {
    font-family: "JetBrains Mono", monospace;
  }

  .stat-num {
    font-size: 28px;
    color: var(--gold);
    font-weight: 500;
  }

  .stat-label {
    font-size: 10px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--text-mute);
    margin-top: 4px;
  }

  /* ─── Mode Switcher ─── */
  .modes {
    display: flex;
    gap: 4px;
    margin-bottom: 32px;
    background: var(--panel);
    padding: 6px;
    border-radius: 999px;
    width: fit-content;
    border: 1px solid var(--border);
  }

  .mode-btn {
    background: transparent;
    border: none;
    color: var(--text-dim);
    font-family: "Sarabun", sans-serif;
    font-size: 14px;
    font-weight: 500;
    padding: 10px 24px;
    border-radius: 999px;
    cursor: pointer;
    transition: all 0.3s cubic-bezier(.45,.05,.35,1);
    letter-spacing: 0.02em;
  }

  .mode-btn:hover { color: var(--text); }

  .mode-btn.active {
    background: var(--gold);
    color: var(--bg);
    font-weight: 600;
  }

  /* ─── Category Tabs ─── */
  .cat-tabs {
    display: flex;
    gap: 24px;
    margin-bottom: 32px;
    border-bottom: 1px solid var(--border);
    padding-bottom: 16px;
    flex-wrap: wrap;
  }

  .cat-tab {
    background: none;
    border: none;
    color: var(--text-mute);
    font-family: "Cormorant Garamond", serif;
    font-size: 22px;
    font-weight: 500;
    cursor: pointer;
    padding: 4px 0;
    position: relative;
    transition: color 0.3s ease;
    letter-spacing: 0.01em;
  }

  .cat-tab:hover { color: var(--text-dim); }

  .cat-tab.active {
    color: var(--gold);
  }

  .cat-tab.active::after {
    content: "";
    position: absolute;
    bottom: -17px;
    left: 0;
    right: 0;
    height: 1px;
    background: var(--gold);
  }

  .cat-tab .count {
    font-family: "JetBrains Mono", monospace;
    font-size: 11px;
    color: var(--text-mute);
    margin-left: 6px;
    vertical-align: super;
  }

  /* ─── Browse: Tone Filter for consonants ─── */
  .tone-filter {
    display: none;
    gap: 12px;
    margin-bottom: 24px;
    flex-wrap: wrap;
  }
  .tone-filter.visible { display: flex; }

  .tone-pill {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--text-dim);
    font-family: "JetBrains Mono", monospace;
    font-size: 11px;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    padding: 6px 14px;
    border-radius: 999px;
    cursor: pointer;
    transition: all 0.25s ease;
  }
  .tone-pill:hover { border-color: var(--gold-dim); color: var(--text); }
  .tone-pill.active {
    background: var(--gold-soft);
    border-color: var(--gold);
    color: var(--gold);
  }

  /* ─── Browse Grid ─── */
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
    gap: 12px;
  }

  .letter-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 20px 16px 16px;
    cursor: pointer;
    transition: all 0.25s cubic-bezier(.45,.05,.35,1);
    position: relative;
    overflow: hidden;
    text-align: center;
    aspect-ratio: 1;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
  }

  .letter-card::before {
    content: "";
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 2px;
    background: var(--tone-mid);
    opacity: 0.6;
    transition: opacity 0.25s ease;
  }
  .letter-card[data-tone="high"]::before { background: var(--tone-high); }
  .letter-card[data-tone="low"]::before { background: var(--tone-low); }
  .letter-card[data-tone="none"]::before { background: var(--gold-dim); opacity: 0.3; }

  .letter-card:hover {
    background: var(--card-flipped);
    transform: translateY(-2px);
    border-color: var(--gold-dim);
  }
  .letter-card:hover::before { opacity: 1; }

  .letter-char {
    font-family: "Noto Sans Thai", serif;
    font-size: 48px;
    font-weight: 500;
    color: var(--text);
    line-height: 1;
    margin-top: 4px;
  }

  .letter-meta {
    display: flex;
    flex-direction: column;
    gap: 2px;
    align-items: center;
  }

  .letter-romanization {
    font-family: "JetBrains Mono", monospace;
    font-size: 13px;
    color: var(--gold);
    letter-spacing: 0.05em;
  }

  .letter-rep {
    font-family: "Sarabun", sans-serif;
    font-size: 11px;
    color: var(--text-mute);
  }

  /* ─── Detail Modal ─── */
  .modal-backdrop {
    position: fixed;
    inset: 0;
    background: rgba(15, 24, 20, 0.85);
    backdrop-filter: blur(8px);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 200;
    padding: 24px;
    animation: fadeIn 0.3s ease;
  }
  .modal-backdrop.open { display: flex; }

  @keyframes fadeIn {
    from { opacity: 0; }
    to { opacity: 1; }
  }

  .modal {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    max-width: 560px;
    width: 100%;
    padding: 0;
    position: relative;
    overflow: hidden;
    animation: modalIn 0.4s cubic-bezier(.45,.05,.35,1);
  }

  @keyframes modalIn {
    from { transform: translateY(20px) scale(0.96); opacity: 0; }
    to { transform: translateY(0) scale(1); opacity: 1; }
  }

  .modal-hero {
    background: var(--card);
    padding: 48px 32px 32px;
    text-align: center;
    position: relative;
    border-bottom: 1px solid var(--border);
  }

  .modal-hero::before {
    content: "";
    position: absolute;
    top: 0;
    left: 50%;
    transform: translateX(-50%);
    width: 80px;
    height: 3px;
    background: var(--gold);
  }

  .modal-close {
    position: absolute;
    top: 16px;
    right: 16px;
    background: transparent;
    border: 1px solid var(--border);
    color: var(--text-dim);
    width: 32px;
    height: 32px;
    border-radius: 50%;
    cursor: pointer;
    font-size: 18px;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.25s ease;
  }
  .modal-close:hover { border-color: var(--gold); color: var(--gold); }

  .modal-char {
    font-family: "Noto Sans Thai", serif;
    font-size: 120px;
    font-weight: 500;
    line-height: 1;
    color: var(--text);
    margin-bottom: 16px;
  }

  .modal-tone-tag {
    display: inline-block;
    font-family: "JetBrains Mono", monospace;
    font-size: 11px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    padding: 5px 14px;
    border-radius: 999px;
    border: 1px solid;
  }
  .modal-tone-tag[data-tone="mid"]  { color: var(--tone-mid); border-color: var(--tone-mid); }
  .modal-tone-tag[data-tone="high"] { color: var(--tone-high); border-color: var(--tone-high); }
  .modal-tone-tag[data-tone="low"]  { color: var(--tone-low); border-color: var(--tone-low); }
  .modal-tone-tag[data-tone="none"] { color: var(--text-mute); border-color: var(--border); }

  .modal-body {
    padding: 32px;
  }

  .info-row {
    display: grid;
    grid-template-columns: 100px 1fr;
    gap: 20px;
    padding: 14px 0;
    border-bottom: 1px solid var(--border);
    align-items: center;
  }
  .info-row:last-child { border-bottom: none; }

  .info-label {
    font-family: "JetBrains Mono", monospace;
    font-size: 10px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--text-mute);
  }

  .info-value {
    font-family: "Sarabun", sans-serif;
    font-size: 16px;
    color: var(--text);
  }

  .info-value .roma {
    font-family: "JetBrains Mono", monospace;
    color: var(--gold);
    font-size: 18px;
    margin-right: 12px;
  }

  .rep-block {
    display: flex;
    align-items: center;
    gap: 16px;
  }

  .rep-icon {
    font-size: 32px;
    line-height: 1;
  }

  .rep-text-wrap {
    display: flex;
    flex-direction: column;
    gap: 2px;
  }

  .rep-thai {
    font-family: "Noto Sans Thai", sans-serif;
    font-size: 18px;
    color: var(--text);
  }

  .rep-zh {
    font-size: 14px;
    color: var(--text-dim);
  }

  .play-btn {
    background: var(--gold);
    color: var(--bg);
    border: none;
    width: 100%;
    padding: 14px;
    border-radius: 6px;
    font-family: "Sarabun", sans-serif;
    font-weight: 600;
    font-size: 14px;
    letter-spacing: 0.05em;
    cursor: pointer;
    margin-top: 24px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    transition: all 0.25s ease;
  }
  .play-btn:hover { background: var(--text); }
  .play-btn:active { transform: scale(0.98); }
  .play-btn.playing {
    background: var(--card-flipped);
    color: var(--gold);
    border: 1px solid var(--gold);
  }

  .play-icon {
    width: 16px;
    height: 16px;
    display: inline-block;
  }

  /* ─── Quiz Mode ─── */
  .quiz-wrap {
    max-width: 560px;
    margin: 40px auto 0;
  }

  .quiz-direction {
    display: flex;
    gap: 8px;
    margin-bottom: 32px;
    background: var(--panel);
    padding: 4px;
    border-radius: 8px;
    border: 1px solid var(--border);
  }

  .quiz-dir-btn {
    flex: 1;
    background: transparent;
    border: none;
    color: var(--text-dim);
    padding: 12px;
    border-radius: 6px;
    font-family: "Sarabun", sans-serif;
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.25s ease;
  }
  .quiz-dir-btn:hover { color: var(--text); }
  .quiz-dir-btn.active {
    background: var(--card);
    color: var(--gold);
  }

  .quiz-progress {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 24px;
    font-family: "JetBrains Mono", monospace;
    font-size: 11px;
    letter-spacing: 0.15em;
    color: var(--text-mute);
  }

  .progress-bar {
    flex: 1;
    height: 2px;
    background: var(--border);
    margin: 0 16px;
    border-radius: 1px;
    overflow: hidden;
  }

  .progress-fill {
    height: 100%;
    background: var(--gold);
    width: 0%;
    transition: width 0.4s cubic-bezier(.45,.05,.35,1);
  }

  .quiz-question {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 56px 32px;
    text-align: center;
    margin-bottom: 24px;
  }

  .quiz-prompt-label {
    font-family: "JetBrains Mono", monospace;
    font-size: 10px;
    letter-spacing: 0.25em;
    text-transform: uppercase;
    color: var(--text-mute);
    margin-bottom: 20px;
  }

  .quiz-prompt {
    font-family: "Noto Sans Thai", serif;
    font-size: 96px;
    font-weight: 500;
    color: var(--text);
    line-height: 1;
  }

  .quiz-prompt.small {
    font-family: "JetBrains Mono", monospace;
    font-size: 40px;
    color: var(--gold);
  }

  .quiz-options {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 12px;
  }

  .quiz-option {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 24px 16px;
    cursor: pointer;
    transition: all 0.25s cubic-bezier(.45,.05,.35,1);
    font-family: "Sarabun", sans-serif;
    text-align: center;
    color: var(--text);
  }

  .quiz-option:hover:not(:disabled) {
    background: var(--card-flipped);
    border-color: var(--gold-dim);
    transform: translateY(-1px);
  }

  .quiz-option .opt-thai {
    font-family: "Noto Sans Thai", sans-serif;
    font-size: 36px;
    line-height: 1;
  }

  .quiz-option .opt-roma {
    font-family: "JetBrains Mono", monospace;
    font-size: 18px;
    color: var(--gold);
  }

  .quiz-option.correct {
    background: #2D4A3E;
    border-color: #7FA68A;
    color: #B8E6C8;
  }

  .quiz-option.wrong {
    background: #3E2A2A;
    border-color: var(--danger);
    color: var(--danger);
  }

  .quiz-option:disabled { cursor: default; }

  .quiz-result {
    margin-top: 24px;
    padding: 20px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    text-align: center;
    display: none;
  }
  .quiz-result.show { display: block; }

  .quiz-result-feedback {
    font-family: "Cormorant Garamond", serif;
    font-style: italic;
    font-size: 22px;
    margin-bottom: 8px;
  }
  .quiz-result-feedback.correct { color: #B8E6C8; }
  .quiz-result-feedback.wrong { color: var(--danger); }

  .quiz-result-detail {
    font-size: 14px;
    color: var(--text-dim);
  }

  .quiz-next {
    margin-top: 16px;
    background: var(--gold);
    color: var(--bg);
    border: none;
    padding: 12px 32px;
    border-radius: 6px;
    font-family: "Sarabun", sans-serif;
    font-weight: 600;
    font-size: 13px;
    letter-spacing: 0.05em;
    cursor: pointer;
    transition: all 0.25s ease;
  }
  .quiz-next:hover { background: var(--text); }

  .quiz-score {
    display: flex;
    justify-content: center;
    gap: 32px;
    margin-bottom: 24px;
    padding: 16px;
    background: var(--panel);
    border-radius: 8px;
    border: 1px solid var(--border);
  }

  .score-cell {
    text-align: center;
    font-family: "JetBrains Mono", monospace;
  }
  .score-cell .num {
    font-size: 24px;
    color: var(--gold);
  }
  .score-cell.correct .num { color: #B8E6C8; }
  .score-cell.wrong .num { color: var(--danger); }
  .score-cell .label {
    font-size: 9px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--text-mute);
    margin-top: 4px;
  }

  /* ─── Writing Mode ─── */
  .write-wrap {
    display: grid;
    grid-template-columns: 320px 1fr;
    gap: 32px;
    margin-top: 24px;
  }

  @media (max-width: 760px) {
    .write-wrap { grid-template-columns: 1fr; }
    .modal-char { font-size: 88px; }
    .quiz-prompt { font-size: 72px; }
    .info-row { grid-template-columns: 80px 1fr; gap: 12px; }
    header { flex-direction: column; align-items: flex-start; gap: 24px; }
    .stats { width: 100%; justify-content: space-between; text-align: left; }
    .stat { text-align: left; }
  }

  .write-sidebar {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 16px;
    max-height: 70vh;
    overflow-y: auto;
  }

  .write-sidebar::-webkit-scrollbar { width: 6px; }
  .write-sidebar::-webkit-scrollbar-thumb { background: var(--gold-dim); border-radius: 3px; }
  .write-sidebar::-webkit-scrollbar-track { background: transparent; }

  .write-letter-list {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 6px;
  }

  .write-letter-item {
    aspect-ratio: 1;
    background: var(--card);
    border: 1px solid transparent;
    border-radius: 6px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: "Noto Sans Thai", serif;
    font-size: 24px;
    color: var(--text);
    transition: all 0.2s ease;
  }
  .write-letter-item:hover { background: var(--card-flipped); }
  .write-letter-item.active {
    background: var(--gold);
    color: var(--bg);
    border-color: var(--gold);
  }

  .write-canvas-wrap {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 32px;
    text-align: center;
    position: relative;
  }

  .write-display {
    font-family: "Noto Sans Thai", serif;
    font-size: 200px;
    font-weight: 500;
    color: var(--text);
    line-height: 1;
    margin: 24px 0;
    letter-spacing: 0.02em;
    position: relative;
    display: inline-block;
    background: linear-gradient(180deg, var(--text) 0%, var(--text) 100%);
    -webkit-background-clip: text;
    background-clip: text;
  }

  .write-guide-wrap {
    display: inline-block;
    position: relative;
    padding: 12px 24px;
    background:
      repeating-linear-gradient(0deg, transparent, transparent 49px, var(--border) 49px, var(--border) 50px),
      repeating-linear-gradient(90deg, transparent, transparent 49px, var(--border) 49px, var(--border) 50px);
    border-radius: 4px;
  }

  .write-info {
    display: flex;
    justify-content: center;
    gap: 24px;
    margin: 16px 0 24px;
    flex-wrap: wrap;
  }

  .write-info-cell {
    font-family: "JetBrains Mono", monospace;
    font-size: 12px;
    color: var(--text-dim);
    letter-spacing: 0.05em;
  }
  .write-info-cell .v { color: var(--gold); margin-left: 6px; }

  .write-tip {
    font-family: "Cormorant Garamond", serif;
    font-style: italic;
    font-size: 16px;
    color: var(--text-mute);
    margin-top: 16px;
    padding: 16px;
    border-top: 1px solid var(--border);
  }

  .write-actions {
    display: flex;
    justify-content: center;
    gap: 12px;
    margin-top: 16px;
    flex-wrap: wrap;
  }

  .write-action-btn {
    background: var(--card);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 10px 20px;
    border-radius: 6px;
    font-family: "Sarabun", sans-serif;
    font-size: 13px;
    cursor: pointer;

const VOWELS = [
  { c: "–ะ",  name: "sara a (短)",     roma: "a",   zh: "啊（短）", tone: "none" },

  { c: "–่", name: "mai ek",   roma: "tone 1",  zh: "低平 / 第一聲調符號",  tone: "none", rep: "標記低聲調" },

const state = {
  mode: "browse",
  category: "consonant",
  toneFilter: "all",
  quizDir: "char-to-roma",
  quizTotal: 0,
  quizCorrect: 0,
  quizWrong: 0,
  quizCurrent: null,
  writeIndex: 0
};

/* ============================================================
   AUDIO  (Web Speech API; replace with real audio later)
   ============================================================ */
function speak(text) {
  if (!("speechSynthesis" in window)) return;
  speechSynthesis.cancel();
  const utter = new SpeechSynthesisUtterance(text);
  utter.lang = "th-TH";
  utter.rate = 0.7;
  utter.pitch = 1;
  speechSynthesis.speak(utter);
  return utter;
}

/* ============================================================
   HELPERS
   ============================================================ */
function getCategoryData(id) {
  return CATEGORIES.find(c => c.id === id).data;
}

function filterData() {
  let data = getCategoryData(state.category);
  if (state.category === "consonant" && state.toneFilter !== "all") {
    data = data.filter(d => d.tone === state.toneFilter);
  }
  return data;
}

function toneLabel(t) {
  return ({ mid: "中音", high: "高音", low: "低音", none: "—" })[t] || "—";
}

/* ============================================================
   RENDER: Category tabs (browse + write share these)
   ============================================================ */
function renderCatTabs(containerId, onChange) {
  const el = document.getElementById(containerId);
  el.innerHTML = "";
  CATEGORIES.forEach(cat => {
    const btn = document.createElement("button");
    btn.className = "cat-tab" + (cat.id === state.category ? " active" : "");
    btn.innerHTML = `${cat.label}<span class="count">${cat.count}</span>`;
    btn.onclick = () => {
      state.category = cat.id;
      onChange();
    };
    el.appendChild(btn);
  });
}

/* ============================================================
   RENDER: Browse Grid
   ============================================================ */
function renderBrowse() {
  renderCatTabs("cat-tabs", () => {
    state.toneFilter = "all";
    renderBrowse();
  });

  // Tone filter visibility
  const tf = document.getElementById("tone-filter");
  tf.classList.toggle("visible", state.category === "consonant");
  tf.querySelectorAll(".tone-pill").forEach(pill => {
    pill.classList.toggle("active", pill.dataset.tone === state.toneFilter);
    pill.onclick = () => {
      state.toneFilter = pill.dataset.tone;
      renderBrowse();
    };
  });

  const grid = document.getElementById("grid");
  const data = filterData();
  grid.innerHTML = "";

  if (data.length === 0) {
    grid.innerHTML = '<div class="empty-state">這個分類下沒有項目</div>';
  } else {
    data.forEach((item, i) => {
      const card = document.createElement("div");
      card.className = "letter-card";
      card.dataset.tone = item.tone;
      card.innerHTML = `
        <div class="letter-char">${item.c}</div>
        <div class="letter-meta">
          <div class="letter-romanization">${item.roma}</div>
          <div class="letter-rep">${item.zh}</div>
        </div>
      `;
      card.onclick = () => openModal(item);
      grid.appendChild(card);
    });
  }

  document.getElementById("stat-total").textContent = getCategoryData(state.category).length;
  document.getElementById("stat-current").textContent = data.length;
}

/* ============================================================
   MODAL
   ============================================================ */
function openModal(item) {
  document.getElementById("m-char").textContent = item.c;
  document.getElementById("m-name").textContent = item.name;
  document.getElementById("m-roma").textContent = item.roma;
  document.getElementById("m-zh").textContent = item.zh;

  const toneTag = document.getElementById("m-tone");
  toneTag.dataset.tone = item.tone;
  toneTag.textContent = toneLabel(item.tone);
  toneTag.style.display = item.tone === "none" ? "none" : "inline-block";

  const repRow = document.getElementById("m-rep-row");
  if (item.rep) {
    repRow.style.display = "";
    document.getElementById("m-rep-icon").textContent = item.repIcon || "•";
    document.getElementById("m-rep-thai").textContent = item.rep;
    document.getElementById("m-rep-zh").textContent = "";
  } else {
    repRow.style.display = "none";
  }

  const classRow = document.getElementById("m-class-row");
  if (item.tone && item.tone !== "none") {
    classRow.style.display = "";
    document.getElementById("m-class").textContent = toneLabel(item.tone) + " (" + item.tone + ")";
  } else {
    classRow.style.display = "none";
  }

  // Play button
  const playBtn = document.getElementById("m-play");
  playBtn.onclick = () => {
    playBtn.classList.add("playing");
    const utter = speak(item.c);
    if (utter) {
      utter.onend = () => playBtn.classList.remove("playing");
    } else {
      setTimeout(() => playBtn.classList.remove("playing"), 600);
    }
  };

  document.getElementById("modal-backdrop").classList.add("open");
}

document.getElementById("modal-close").onclick = closeModal;
document.getElementById("modal-backdrop").onclick = (e) => {
  if (e.target.id === "modal-backdrop") closeModal();
};
function closeModal() {
  document.getElementById("modal-backdrop").classList.remove("open");
  speechSynthesis.cancel();
}
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape") closeModal();
});

/* ============================================================
   QUIZ
   ============================================================ */
function pickRandom(arr, n, exclude) {
  const pool = arr.filter(x => x !== exclude);
  const out = [];
  while (out.length < n && pool.length) {
    const idx = Math.floor(Math.random() * pool.length);
    out.push(pool.splice(idx, 1)[0]);
  }
  return out;
}

function newQuestion() {
  const pool = CONSONANTS.concat(VOWELS); // tone marks excluded from quiz
  const ans = pool[Math.floor(Math.random() * pool.length)];
  const distractors = pickRandom(pool, 3, ans);
  const options = [ans, ...distractors].sort(() => Math.random() - 0.5);

  state.quizCurrent = { ans, options };
  document.getElementById("quiz-result").classList.remove("show");

  const promptEl = document.getElementById("quiz-prompt");
  const labelEl = document.getElementById("quiz-label");
  const optsEl = document.getElementById("quiz-options");
  optsEl.innerHTML = "";

  if (state.quizDir === "char-to-roma") {
    promptEl.textContent = ans.c;
    promptEl.classList.remove("small");
    labelEl.textContent = "這個字母的讀音是？";
    options.forEach(opt => {
      const btn = document.createElement("button");
      btn.className = "quiz-option";
      btn.innerHTML = `<div class="opt-roma">${opt.roma}</div>`;
      btn.onclick = () => answerQuiz(opt, btn);
      optsEl.appendChild(btn);
    });
  } else {
    promptEl.textContent = ans.roma;
    promptEl.classList.add("small");
    labelEl.textContent = "對應的字母是？";
    options.forEach(opt => {
      const btn = document.createElement("button");
      btn.className = "quiz-option";
      btn.innerHTML = `<div class="opt-thai">${opt.c}</div>`;
      btn.onclick = () => answerQuiz(opt, btn);
      optsEl.appendChild(btn);
    });
  }

  // progress numbers
  state.quizTotal++;
  document.getElementById("qp-num").textContent = "Q" + state.quizTotal;
  document.getElementById("qs-total").textContent = state.quizTotal;
}

function answerQuiz(picked, btn) {
  const { ans, options } = state.quizCurrent;
  const correct = picked === ans;
  const allBtns = document.querySelectorAll("#quiz-options .quiz-option");
  allBtns.forEach(b => {
    b.disabled = true;
    const opt = options[Array.from(allBtns).indexOf(b)];
    if (opt === ans) b.classList.add("correct");
    if (b === btn && !correct) b.classList.add("wrong");
  });

  if (correct) {
    state.quizCorrect++;
    document.getElementById("qs-correct").textContent = state.quizCorrect;
    document.getElementById("qr-feedback").textContent = "✓  正確";
    document.getElementById("qr-feedback").className = "quiz-result-feedback correct";
  } else {
    state.quizWrong++;
    document.getElementById("qs-wrong").textContent = state.quizWrong;
    document.getElementById("qr-feedback").textContent = "✗  再試一次";
    document.getElementById("qr-feedback").className = "quiz-result-feedback wrong";
  }
  document.getElementById("qr-detail").innerHTML =
    `<strong>${ans.c}</strong> · ${ans.name} · <span style="color:var(--gold);font-family:'JetBrains Mono',monospace;">${ans.roma}</span> · ${ans.zh}`;

  // Progress bar — assume target of 20 questions for full bar
  const pct = Math.min(100, Math.round(state.quizCorrect / 20 * 100));
  document.getElementById("qp-fill").style.width = pct + "%";
  document.getElementById("qp-pct").textContent = pct + "%";

  document.getElementById("quiz-result").classList.add("show");

  // Auto-play the answer's pronunciation
  speak(ans.c);
}

document.getElementById("qr-next").onclick = newQuestion;

document.querySelectorAll(".quiz-dir-btn").forEach(b => {
  b.onclick = () => {
    document.querySelectorAll(".quiz-dir-btn").forEach(x => x.classList.remove("active"));
    b.classList.add("active");
    state.quizDir = b.dataset.dir;
    newQuestion();
  };
});

/* ============================================================
   WRITING / DETAIL VIEW
   ============================================================ */
function renderWrite() {
  renderCatTabs("write-cat-tabs", () => {
    state.writeIndex = 0;
    renderWrite();
  });

  const data = getCategoryData(state.category);
  const list = document.getElementById("write-list");
  list.innerHTML = "";
  data.forEach((item, i) => {
    const cell = document.createElement("button");
    cell.className = "write-letter-item" + (i === state.writeIndex ? " active" : "");
    cell.textContent = item.c;
    cell.onclick = () => {
      state.writeIndex = i;
      renderWrite();
    };
    list.appendChild(cell);
  });

  const cur = data[state.writeIndex];
  document.getElementById("write-display").textContent = cur.c;
  document.getElementById("write-cat-label").textContent =
    state.category === "consonant" ? "CONSONANT" :
    state.category === "vowel" ? "VOWEL" : "TONE MARK";
  document.getElementById("wi-name").textContent = cur.name;
  document.getElementById("wi-roma").textContent = cur.roma;
  document.getElementById("wi-zh").textContent = cur.zh;

  // Tip rotation
  const tips = {
    consonant: "提示：泰文書寫從圓圈（หัว）開始，順時針或逆時針依字母而定，最後寫主體線條。",
    vowel: "提示：母音可寫在子音的前、後、上、下，書寫順序仍以子音為先。",
    tone: "提示：聲調符號永遠寫在字的最上方，於母音之上。"
  };
  document.getElementById("write-tip").textContent = tips[state.category];
}

document.getElementById("write-prev").onclick = () => {
  const data = getCategoryData(state.category);
  state.writeIndex = (state.writeIndex - 1 + data.length) % data.length;
  renderWrite();
};
document.getElementById("write-next").onclick = () => {
  const data = getCategoryData(state.category);
  state.writeIndex = (state.writeIndex + 1) % data.length;
  renderWrite();
};
document.getElementById("write-play").onclick = () => {
  const cur = getCategoryData(state.category)[state.writeIndex];
  speak(cur.c);
};

/* ============================================================
   MODE SWITCHER
   ============================================================ */
document.querySelectorAll(".mode-btn").forEach(btn => {
  btn.onclick = () => {
    document.querySelectorAll(".mode-btn").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    state.mode = btn.dataset.mode;
    document.querySelectorAll(".view").forEach(v => v.classList.remove("active"));
    document.getElementById("view-" + state.mode).classList.add("active");

    if (state.mode === "browse") renderBrowse();
    if (state.mode === "quiz") {
      // reset on first entry; keep on subsequent
      if (state.quizTotal === 0) newQuestion();
    }
    if (state.mode === "write") renderWrite();
  };
});

/* ============================================================
   INIT
   ============================================================ */
renderBrowse();
</script>
